name: Lint
on: [push, pull_request]
jobs:
  build:
    name: Lint add-on configuration
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v4
      - name: 🚀 Run Home Assistant Add-on Linter
        uses: frenck/action-addon-linter@v2.21.1
        with:
          path: "./hass_gdrive_backup"
  image:
    name: Build add-on image
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: 🏗 Build the add-on the way the Supervisor does (without build.yaml)
        uses: docker/build-push-action@v7
        with:
          context: hass_gdrive_backup
          push: false
          build-args: |
            BUILD_ARCH=amd64
